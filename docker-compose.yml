version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: balaji_aqua_db
    environment:
      POSTGRES_USER: balaji_user
      POSTGRES_PASSWORD: balaji_aqua_2026
      POSTGRES_DB: balaji_aqua_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - balaji_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balaji_user -d balaji_aqua_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: balaji_aqua_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: sribalajiaqua2026@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Balaji@2026
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - balaji_network

volumes:
  postgres_data:
    name: balaji_aqua_postgres_data
  pgadmin_data:
    name: balaji_aqua_pgadmin_data

networks:
  balaji_network:
    name: balaji_aqua_network
    driver: bridge
